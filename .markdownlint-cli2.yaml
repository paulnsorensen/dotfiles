config:
  line-length: false
  no-inline-html: false
  first-line-heading: false
  table-column-style: false
  fenced-code-language: false
  no-duplicate-heading: false
  single-title: false
  no-emphasis-as-heading: false

ignores:
  # Match node_modules at any depth — skills that npm-install (e.g.
  # skills/roadmap/scripts) create nested trees the root glob misses.
  - "**/node_modules/**"
  # Nested agent worktrees are derived checkouts, not canonical documentation.
  - "**/.claude/worktrees/**"
  - "**/.worktrees/**"
  - .worktrees/**
  - reference/**
  - tmux/plugins/**
  - vim/undo/**
  - .cheese/**
  - .context/**
  # Derived, gitignored: assembled by sync_claude_chezmoi_sources,
  # sync_codex_chezmoi_sources, and sync_omp_chezmoi_sources (also by the
  # test suite) from skills/ etc., which are linted at source.
  - chezmoi/dot_claude/exact_*/**
  - chezmoi/private_dot_codex/exact_*/**
  - chezmoi/dot_omp/private_agent/exact_skills/**
  # Cursor IDE runtime output is gitignored and not repository documentation.
  - cursor/**
