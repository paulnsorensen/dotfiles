[project]
name = "agent-profile"
version = "0.1.0"
description = "Harness-agnostic agent profile renderer (Python port of the ap bash CLI)"
requires-python = ">=3.11"
dependencies = [
    "tomlkit>=0.15.1",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_profile"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.6.1",
    "tiktoken==0.14.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
# NOTE: -n auto is deliberately NOT in addopts. `just test-python` passes it so
# the gate fans across all cores, while a bare `pytest -k foo --pdb` stays serial
# and debuggable (xdist breaks --pdb and defers -x).
