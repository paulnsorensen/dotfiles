name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A pull_request run cancels an older run of the same PR. A push to main
# gets a group per commit, so it always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install shellcheck
      run: sudo apt-get install -y shellcheck

    - name: Install ruff
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      with:
        # renovate: datasource=pypi depName=ruff
        version: "0.17.0"
        args: "--version"

    - name: Install Node linters
      run: |
        npm ci --prefix .github/lint-deps
        echo "$(pwd)/.github/lint-deps/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run linters
      run: just lint

  test-shard:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Install zsh
      run: sudo apt-get install -y zsh
    - name: Install bats
      run: sudo npm install -g bats

    # The harness-climb and session-analytics tests need the duckdb CLI.
    # The version matches chezmoi/dot_config/mise/config.toml.
    - name: Install duckdb
      env:
        DUCKDB_VERSION: v1.5.6
        DUCKDB_SHA256: 6e89deac1ebbc36eed0291caf8b567b030c7b86ac35998f71854e22b3c5d5e2f
      run: |
        curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" \
          "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
        echo "${DUCKDB_SHA256}  $RUNNER_TEMP/duckdb.zip" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/duckdb-bin"
        unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb-bin"
        echo "$RUNNER_TEMP/duckdb-bin" >> "$GITHUB_PATH"

    # The bash-shortening tests need `sg` (ast-grep). Ubuntu's util-linux also
    # ships `sg`, so put the uv tool bin first on PATH.
    - name: Install ast-grep
      run: |
        uv tool install ast-grep-cli==0.42.1
        uv tool dir --bin >> "$GITHUB_PATH"

    - name: Install chezmoi
      run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

    - name: Install prek
      uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
      with:
        install-only: true

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Install Node test dependencies
      run: |
        npm ci --prefix .github/lint-deps
        echo "$(pwd)/.github/lint-deps/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run tests
      run: just test --shard ${{ matrix.shard }}/4 --timings /tmp/bats-timings

    - name: Upload Bats timings
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bats-timings-${{ matrix.shard }}
        path: /tmp/bats-timings
        retention-days: 5

  test-extras:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Run Python tests
      run: just test-python

    - name: Run smoke tests
      run: just smoke

  # Holds a claude-code or codex pin bump while a harness-climb soak window
  # is open. It reads labels from the API at run time, so a re-run after
  # someone adds the override label sees the new label.
  # It needs the PR base SHA, so it skips on push.
  soak-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Check soak windows
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        bin/ci-soak-gate guard "$BASE_SHA"
        PR_LABELS="$(bin/ci-soak-gate labels)"
        python3 skills/harness-climb/scripts/harness_climb.py soak-check --base "$BASE_SHA" --labels "$PR_LABELS" --main-ref origin/main

  # Stable aggregate gate. Branch protection requires the check named `test`,
  # so do not change that name when the shard count changes. The job needs
  # `if: always()` plus an explicit result assertion. Without them, a failed
  # shard makes this job skip, and a skipped required check does not block a
  # merge. The gate would then pass while tests are red.
  # The gate accepts a skip only for soak-check on push, where it has no base SHA.
  test:
    runs-on: ubuntu-latest
    needs: [test-shard, test-extras, soak-check]
    if: always()

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        sparse-checkout: bin/ci-soak-gate
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Assert every test job succeeded
      env:
        EVENT: ${{ github.event_name }}
        SHARDS: ${{ needs.test-shard.result }}
        EXTRAS: ${{ needs.test-extras.result }}
        SOAK: ${{ needs.soak-check.result }}
      run: bin/ci-soak-gate assert
