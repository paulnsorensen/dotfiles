name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install shellcheck
      run: sudo apt-get install -y shellcheck

    - name: Install ruff
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      with:
        args: "--version"

    - name: Install Node linters
      run: |
        npm ci --prefix .github/lint-deps
        echo "$(pwd)/.github/lint-deps/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run linters
      run: just lint

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Install bats
      run: sudo npm install -g bats

    - name: Install chezmoi
      run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

    - name: Install prek
      uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
      with:
        install-only: true

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Install yq
      run: |
        yq_version="$(awk -F ' = ' '/^"aqua:mikefarah\/yq" = / { gsub(/"/, "", $2); print $2; exit }' chezmoi/dot_config/mise/config.toml)"
        test -n "$yq_version" || { echo "yq pin missing from mise config" >&2; exit 1; }
        mkdir -p "$RUNNER_TEMP/bin"
        GOBIN="$RUNNER_TEMP/bin" go install "github.com/mikefarah/yq/v4@$yq_version"
        "$RUNNER_TEMP/bin/yq" --version
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - name: Run tests
      run: just test

    - name: Run smoke tests
      run: just smoke
