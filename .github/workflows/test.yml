name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install shellcheck
      run: sudo apt-get install -y shellcheck

    - name: Install ruff
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      with:
        args: "--version"

    - name: Install Node linters
      run: |
        npm ci --prefix .github/lint-deps
        echo "$(pwd)/.github/lint-deps/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run linters
      run: just lint

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

    - name: Install Codex parity prerequisites
      env:
        CHEESE_FLOW_REV: 862d8176cb5e87fc557e30c995fc8b2c7d49270d
        YQ_VERSION: v4.53.3
        YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
        curl -fsSL --retry 3 \
          "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
          -o "$RUNNER_TEMP/yq"
        printf '%s  %s\n' "$YQ_SHA256" "$RUNNER_TEMP/yq" | sha256sum -c -
        sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
        uv tool install --force \
          --from "git+https://github.com/paulnsorensen/cheese-flow.git@${CHEESE_FLOW_REV}" \
          cheese-flow
        export PATH="$HOME/.local/bin:$PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        command -v jq
        command -v yq
        command -v cheese

    - name: Install bats
      run: sudo npm install -g bats

    - name: Install chezmoi
      run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

    - name: Install prek
      uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
      with:
        install-only: true

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Run tests
      run: just test

    - name: Run smoke tests
      run: just smoke
