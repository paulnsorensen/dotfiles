name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Only pull_request runs cancel; a push to main always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install shellcheck
      run: sudo apt-get install -y shellcheck

    - name: Install ruff
      uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
      with:
        args: "--version"

    - name: Install Node linters
      run: |
        npm ci --prefix .github/lint-deps
        echo "$(pwd)/.github/lint-deps/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run linters
      run: just lint

  test-shard:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Install zsh
      run: sudo apt-get install -y zsh
    - name: Install bats
      run: sudo npm install -g bats

    # bash-shortening tests need `sg` (ast-grep). Ubuntu's util-linux also
    # ships `sg`, so the uv tool bin goes first on PATH.
    - name: Install ast-grep
      run: |
        uv tool install ast-grep-cli==0.42.1
        uv tool dir --bin >> "$GITHUB_PATH"

    - name: Install chezmoi
      run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

    - name: Install prek
      uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
      with:
        install-only: true

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Install Node test dependencies
      run: |
        npm ci --prefix .github/lint-deps
        echo "$(pwd)/.github/lint-deps/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run tests
      run: just test --shard ${{ matrix.shard }}/4 --timings /tmp/bats-timings

    - name: Upload Bats timings
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bats-timings-${{ matrix.shard }}
        path: /tmp/bats-timings
        retention-days: 5

  test-extras:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Run Python tests
      run: just test-python

    - name: Run smoke tests
      run: just smoke

  # Holds a claude-code or codex pin bump while a harness-climb soak window
  # is open. It reads labels from the API at run time, so a re-run after
  # the override label is added sees the new label.
  # It needs the PR base SHA, so it skips on push.
  soak-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Check soak windows
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if ! PR_LABELS="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')"; then
          echo "gh pr view failed; cannot read PR labels" >&2
          exit 1
        fi
        python3 skills/harness-climb/scripts/harness_climb.py soak-check --base "$BASE_SHA" --labels "$PR_LABELS" --main-ref origin/main

  # Stable aggregate gate. Branch protection requires the check named `test`,
  # so that name must not change when the shard count does. `if: always()`
  # plus an explicit result assertion is required: without it a failed shard
  # makes this job *skip*, and a skipped required check does not block a
  # merge -- the gate would silently pass while tests were red.
  # A skip is accepted only for soak-check on push, where it has no base SHA.
  test:
    runs-on: ubuntu-latest
    needs: [test-shard, test-extras, soak-check]
    if: always()

    steps:
    - name: Assert every test job succeeded
      env:
        EVENT: ${{ github.event_name }}
        SHARDS: ${{ needs.test-shard.result }}
        EXTRAS: ${{ needs.test-extras.result }}
        SOAK: ${{ needs.soak-check.result }}
      run: |
        echo "event=$EVENT test-shard=$SHARDS test-extras=$EXTRAS soak-check=$SOAK"
        if [ "$EVENT" = push ]; then
          [ "$SHARDS" = success ] && [ "$EXTRAS" = success ] && { [ "$SOAK" = success ] || [ "$SOAK" = skipped ]; }
        else
          [ "$SHARDS" = success ] && [ "$EXTRAS" = success ] && [ "$SOAK" = success ]
        fi
