# Upstream Pi registry — source of truth for ~/.pi/agent/settings.json and
# models.json. Managed settings are authored wholesale; interactive /settings,
# `pi config`, and `pi install` changes must be promoted here before dots sync.
# Pi-owned auth, trust, sessions, and package stores are separate files/directories
# under ~/.pi/agent and remain untouched.

pi:
  settings:
    defaultProvider: openai-codex
    defaultModel: gpt-5.6-terra
    defaultThinkingLevel: medium
    hideThinkingBlock: true
    theme: chocolate-donut
    quietStartup: true
    defaultProjectTrust: ask
    enableSkillCommands: true
    compaction:
      enabled: true
      reserveTokens: 16384
      keepRecentTokens: 20000
    retry:
      enabled: true
      maxRetries: 3
      provider:
        maxRetries: 0
        maxRetryDelayMs: 60000
    packages:
      # renovate: datasource=npm depName=pi-mcp-adapter
      - npm:pi-mcp-adapter@2.23.0
      # renovate: datasource=npm depName=pi-subagents
      - npm:pi-subagents@0.46.0
  localModels:
    providers:
      local-llm:
        baseUrl: http://127.0.0.1:4000/v1
        api: openai-completions
        apiKey: local
        models:
          - id: local-haiku
            name: Local Haiku (Qwen3-8B, CPU, hot)
            reasoning: false
            input: [text]
            contextWindow: 16384
            maxTokens: 4096
          - id: local-sonnet
            name: Local Sonnet (Qwen3-30B-A3B, iGPU, swap)
            reasoning: false
            input: [text]
            contextWindow: 32768
            maxTokens: 8192
          - id: local-coder
            name: Local Coder (Qwen3-Coder-30B-A3B, iGPU, swap)
            reasoning: false
            input: [text]
            contextWindow: 32768
            maxTokens: 8192
          - id: local-vision
            name: Local Vision (Qwen3-VL-8B, CPU, swap)
            reasoning: false
            input: [text, image]
            contextWindow: 8192
            maxTokens: 2048
