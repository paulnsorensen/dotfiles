# mise config — chezmoi-rendered to ~/.config/mise/config.toml.
#
# Every tool is pinned to an exact version (no `latest`, no `^`/`~` ranges).
# Version-string convention:
#   - `aqua:` entries use the researched raw GitHub release tag; Aqua applies
#     per-tool prefix/filter normalization from its registry metadata.
#   - core-plugin entries (node, bun, rust): the plain semver the tool
#     itself reports, stripped of any git-tag prefix (mise core plugins
#     query the tool's own version scheme, not a GitHub tag).
#   - npm-backend entries: bare semver (npm versions never carry a prefix).
#   - cargo-backend entries (eza, tokei): bare crates.io semver. Both were
#     aqua-pinned until the aqua registry retyped them as `cargo`-type
#     packages (no prebuilt binaries), which mise's aqua backend refuses.
#
# gopls was dropped 2026-07-27: the aqua registry types it `go_install`
# (unsupported by mise's aqua backend) and the go backend needs a full Go
# toolchain — no Go work on this machine. Re-add alongside a pinned `go`
# core-plugin entry if that changes.
#
# mas-cli/mas was dropped 2026-07-28: this manifest is one universal file
# deployed to every machine (mise has no per-OS gating), and mas's aqua
# build is darwin-only — `mise install` hard-fails on Linux. It's a plain
# brew formula anyway, so it's pinned in packages/packages.yaml under
# `platform: mac` instead, which already supports OS-scoped packages.
#
# rust-analyzer uses a date-stamp release tag (not semver) and tmux uses
# `v3.7b` — both kept as-is, not normalized to look more like semver.
#
# tmux, protobuf, mergiraf, and nextest-rs/nextest are pinned via
# sub-package aqua IDs (`tmux/tmux-builds`, `.../protobuf/protoc`,
# `codeberg.org/mergiraf/mergiraf`, `nextest-rs/nextest/cargo-nextest`) —
# the bare `owner/repo` IDs 404 against aqua-registry; these are the actual
# registry paths (verified against aquaproj/aqua-registry@main).

