# packages.yaml — flat package registry
#
# Bare string = brew formula (mac + linux)
# Key-value = override defaults
#
#   source:      brew (default) | cask | tap | cargo | npm | uv | gh-extension
#   dev:         only when DOTFILES_DEV=true
#   platform:    mac | linux (default: both)
#   flags:       extra args spliced into the installer (uv source only;
#                e.g. ["--python", "3.13", "--prerelease=allow"])

packages:
  - tinted-theming/tinted: { source: tap }
  - koekeishiya/formulae: { source: tap }     # skhd

  # Core CLI not owned by the mise manifest
  - tree
  - htop
  - tinty
  - watch
  - parallel                                  # GNU parallel — run shell jobs concurrently
  - gettext
  - taf2/tap/mdvi

  # Remote access (Tailscale mesh VPN → SSH bootstrap → mosh)
  - mosh                                      # resilient mobile shell (UDP 60000-61000); survives roaming/sleep
  # Tailscale: install manually, not via brew/dots sync. macOS uses the website/
  # App Store install (one GUI variant — never run two side by side); Linux uses
  # the official installer `curl -fsSL https://tailscale.com/install.sh | sh`,
  # which wires the systemd daemon. Then `tailscale up`. See operations/remote-access wiki.

  # macOS-only
  - trash: { platform: mac }                  # Move to Trash (safer rm)
  - terminal-notifier: { platform: mac }      # macOS notifications from terminal
  - skhd: { platform: mac }                   # Hotkey daemon (from koekeishiya/formulae tap)
  - emdash: { source: cask, platform: mac }   # Desktop UI for running coding agents in parallel
  - cursor: { source: cask, platform: mac, greedy: false } # Cursor — AI code editor; self-updates in-app
  - cursor-cli: { source: cask, platform: mac } # Cursor CLI — command-line agent (cursor-agent)
  - obsidian: { source: cask, platform: mac } # Obsidian — Markdown knowledge base
  - alt-tab: { source: cask, platform: mac }  # AltTab — window switcher (prefs restored by alttab/.sync)
  - alfred: { source: cask, platform: mac }   # Alfred — launcher (sync folder wired by alfred/.sync)
  - rectangle-pro: { source: cask, platform: mac } # Rectangle Pro — window snapping
  - rjyo/moshi/moshi-hook: { platform: mac }  # Moshi phone bridge; Linux uses Moshi's own installer

  # Linux-only
  - xclip: { platform: linux }

  # Dev (DOTFILES_DEV=true)
  - pyenv: { dev: true }
  - docker-desktop: { source: cask, dev: true, platform: mac, greedy: false } # self-updates in-app

  # LSP servers not owned by mise
  # renovate: datasource=npm depName=@vtsls/language-server
  - vtsls: { source: npm, pkg: "@vtsls/language-server", version: "0.3.0" }

  # Linters
  # renovate: datasource=npm depName=eslint
  - eslint: { source: npm, version: "8.57.1" }
  # renovate: datasource=npm depName=markdownlint-cli2
  - markdownlint-cli2: { source: npm, version: "0.23.1" }
  # renovate: datasource=npm depName=ccusage
  - ccusage: { source: npm, version: "20.0.18" }
  # renovate: datasource=npm depName=@govcraft/agent-skills
  - agent-skills: { source: npm, pkg: "@govcraft/agent-skills", version: "0.4.4" }
  # renovate: datasource=npm depName=@withgraphite/graphite-cli
  - graphite: { source: npm, pkg: "@withgraphite/graphite-cli", platform: linux, version: "1.8.6" } # `gt` — stacked-diff PR workflow

  # uv tools (Python)
  # renovate: datasource=pypi depName=ralphify
  - ralphify: { source: uv, version: "0.3.0" }
  # renovate: datasource=pypi depName=ruff
  - ruff: { source: uv, version: "0.16.0" } # Python linter (just lint-python)
  # renovate: datasource=pypi depName=check-jsonschema
  - check-jsonschema: { source: uv, version: "0.37.4" }
  # renovate: datasource=git-refs depName=agentskills/agentskills
  - skills-ref: { source: uv, pkg: "git+https://github.com/agentskills/agentskills@main#subdirectory=skills-ref", rev: "38a2ff82958afee88dadf4831509e6f7e9d8ef4e" }
  # renovate: datasource=pypi depName=tavily-cli
  - tavily-cli: { source: uv, version: "0.1.5" } # provides `tvly` CLI for Tavily API
  - milknado: { source: uv, pkg: "git+https://github.com/paulnsorensen/milknado@main" } # approved floating own-authored channel
  # Serena pins Python 3.13 and ships pre-release builds on PyPI.
  # renovate: datasource=pypi depName=serena-agent
  - serena-agent: { source: uv, version: "1.6.1", flags: ["--python", "3.13", "--prerelease=allow"] }

  # gh CLI extensions
  # renovate: datasource=github-releases depName=github/gh-stack
  - gh-stack: { source: gh-extension, pkg: github/gh-stack, version: "v0.0.8" }

  # Cargo
  # renovate: datasource=crate depName=cargo-update
  - cargo-update: { source: cargo, version: "22.1.0" } # provides `cargo install-update`
  # tilth and hallouminate stay on their own-authored npm nightly channels via
  # chezmoi run_onchange installers; no cargo copy may shadow them.
