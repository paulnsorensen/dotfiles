# global — launch-only personal policy profile.
#
# Persistent deployment uses `profiles/live/profile.yaml` through explicit
# `dots profile compile` and `dots profile apply` commands.
name: global
description: Global launch profile; persistent deployment uses profile `live`
include: [base, _permissions]
target_default: $HOME
marketplaces:
  local: $HOME/.claude/plugins/local
enabled_plugins:
  global@local: true
mcp_scope: user
