# opencode-global — migration stub for the old opencode live install profile.
#
# Persistent deployment moved to `profiles/live/profile.yaml`; its `opencode`
# compile target writes to $HOME/.config/opencode when explicitly compiled and applied.
name: opencode-global
description: Deprecated opencode install alias; use profile `live`
include: [base, _permissions]
target_default: $HOME/.config/opencode
