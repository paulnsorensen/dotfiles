# review — read-only PR review (ccp parity).
# Reviewers read and file comments; they don't fix. Edit/Write/MultiEdit/
# NotebookEdit and tilth's writer are denied; the tool surface is a read-only whitelist.
# MCP world is tilth + context7.
name: review
description: Read-only PR review
# Cheese sub-agents are available in this closed world too
# (agents are orthogonal to the MCP/skill scope below).
registries:
  agents: agents/registry.yaml
isolated: true
system_prompt: CLAUDE.md
tools:
  - Read
  - Grep
  - Glob
  - Bash
  - Skill
  - Agent
  - TaskCreate
  - TaskUpdate
  - TaskList
  - AskUserQuestion
permissions_deny:
  - Edit
  - Write
  - MultiEdit
  - NotebookEdit
  - mcp__tilth__tilth_write
# Per-profile plugin set (ccp settings-merge parity).
enabled_plugins:
  "claude-md-management@claude-plugins-official": true
  "plugin-dev@claude-plugins-official": false
  "skill-creator@claude-plugins-official": false
  "frontend-design@claude-plugins-official": false
  "playwright@claude-plugins-official": false
  "todoist-flow@todoist-flow": false
mcps:
  - name: tilth
    command: tilth
    args: ["--mcp", "--edit"]
  - name: context7
    command: agent-secret-proxy
    args: ["--socket", "/var/run/dotfiles-agent-secrets/context7.sock"]
