# Cargo global configuration
# Managed by dotfiles — synced to ~/.cargo/config.toml via cargo/.sync

# Wrap rustc with sccache for cross-project / cross-branch compile caching.
# Requires CARGO_INCREMENTAL=0 (set in zsh/tools.zsh) — sccache cannot cache
# incremental builds.
[build]
rustc-wrapper = "sccache"

# Linker: leave at default. Apple's ld (Xcode 15+, currently ld-1267) is the
# fast parallel rewrite and beats lld for Mach-O on Apple Silicon. Don't add
# `-fuse-ld=lld` here unless benchmarks on this machine prove otherwise.

# Linux (this box): mold via clang cuts link time and peak link memory — the
# latter matters because parallel agent gates were getting OOM-reaped under
# earlyoom. The macOS guidance above still holds for the default (Apple
# Silicon) target, which is left untouched. Validated with mold 2.42 + clang.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Linux (this box): point openssl-sys at the distro OpenSSL. Homebrew's
# pkg-config otherwise resolves Homebrew's linked `openssl` (now 4.x), and
# build scripts linked against it fail to load libssl.so.4 at runtime.
# Target-prefixed, so macOS builds ignore these.
[env]
X86_64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR = "/usr/lib/x86_64-linux-gnu"
X86_64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR = "/usr/include"
