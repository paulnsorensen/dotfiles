# agents/plugins/registry.yaml — cross-harness plugin registry
#
# Each entry names a plugin and points at its marketplace root. At ingest time,
# `ap` auto-discovers the plugin's primitives from the payload dir and
# decomposes them into the existing per-harness renderers:
#
#   .mcp.json                         → MCP server(s), with the entry's harnesses list
#   skills/<n>/SKILL.md               → path: skill items
#   agents/*.md                       → agent items from leading YAML frontmatter
#   .claude-plugin/plugin.json hooks  → hook items (script hooks cross-harness)
#
# `commands/` is intentionally NOT decomposed. Native plugin installs may still
# expose commands inside their native harness; the decomposed path does not.
# _source_dir on every emitted item is stamped at the plugin payload root
# (NOT the repo root). Renderers resolve payload files via:
#   Path(item["_source_dir"]) / item["path"]
#
# Schema per entry:
#   KEY:           the entry name (e.g. `milknado`) MUST equal a plugins[].name
#                  in the marketplace.json — that named plugin is the one
#                  decomposed. A key/name mismatch fails loud at ingest.
#
#   Source (exactly one required; both or neither raises ParseError):
#   path:          marketplace root (local checkout); ~-relative, /absolute, or
#                  repo-relative. Use on machines that have a local dev tree.
#   git:           clone URL (e.g. https://github.com/org/repo). The repo is
#                  cloned / refreshed into ~/.cache/ap/plugins/<KEY>.
#   branch:        branch to clone (optional; default: main). Only with git:.
#   subdir:        sub-directory inside the repo whose root is the marketplace
#                  root (i.e. contains .claude-plugin/marketplace.json).
#                  Optional; default: repo root. Relative paths only; no '..'.
#
#   harnesses:     primitive membership list. MCP membership is explicit to
#                  avoid blanket-wide per-request token tax; non-MCP plugin
#                  primitives default to every harness that supports them.
#   native:        which harnesses get the NATIVE marketplace install (atomic
#                  plugin install + plugin-scoped mcp__plugin_<plugin>_<server>__
#                  tool names) instead of decomposed primitives. Accepts:
#                    true            → every DRIVABLE harness in `harnesses`
#                                      (drivable = claude, codex, copilot)
#                    false / absent  → decomposed everywhere (default)
#                    [claude, ...]   → only the listed harnesses (must be ⊆
#                                      drivable AND ⊆ `harnesses`; else fail loud)
#                  Non-native harnesses always get decomposed primitives. The
#                  renderers rewrite the canonical mcp__<server>__* permission
#                  rules + skill allowed-tools to the plugin-namespaced form on
#                  harnesses where the plugin is native.
#   claude_native / codex_native: DEPRECATED aliases — true OR's the harness
#                  into the resolved `native:` set.
#   gate_unless:   optional env var gate on the decomposed MCP items (same
#                  semantics as the MCP registry gate). Does NOT gate the
#                  Claude-native install path — that descriptor carries no gate.
#   description:   human-readable description
#
# Per-harness reach:
#   claude   → native marketplace install when native ∋ claude; else MCP + skills + agents + hooks
#   codex    → native marketplace install when native ∋ codex; else MCP + skills + agents + hooks
#   cursor   → MCP + skills + agents + hooks (never native — GUI marketplace only)
#   copilot  → native marketplace install when native ∋ copilot; else skills + hooks + agents (+ MCP if harnesses ∋ copilot)
#   commands → unsupported on the decomposed path for every harness
#
# Edit this file, then run `dots sync` to deploy (base-sync retired;
# claude-global config is chezmoi-authoritative — see chezmoi/.chezmoidata/claude.yaml).

plugins:
  # milknado: Mikado execution engine
  # Payload: 1 MCP + 3 skills (harvest, load-roadmap, milknado-config)
  # branch: main — latest skills/agents chosen over launcher robustness
  # (decided 2026-08-31). The plugin's own .mcp.json launcher
  # (`uvx --from git+...@main`) fetches GitHub on each cold MCP start and
  # can fail or run slow; switching to `stable` would pin that launch to
  # the PyPI release. The fe profile and Zed sidestep the fetch: they
  # launch the `milknado-mcp` binary that packages.yaml installs with
  # float: true, so every dots sync upgrades it.
  milknado:
    git: https://github.com/paulnsorensen/milknado
    branch: main
    harnesses: [claude, codex, cursor, copilot]
    native: [claude, copilot]
    # codex omitted from native: — milknado's upstream .agents/plugins/marketplace.json
    # (the manifest codex reads) lacks a top-level `name`, so
    # `codex plugin marketplace add` exits 1 and codex would get NEITHER the
    # native install NOR the decomposed MCP (DEDUP strips codex when native).
    # Re-enable by adding `codex` to the list (or switching to `native: true`)
    # once upstream adds `"name": "milknado"`, then confirm
    # `codex plugin marketplace add` succeeds against ~/.cache/ap/plugins/milknado.
    description: Mikado execution engine — goal decomposition, batch planning, detached ralph-loop runs

  # hallouminate: per-repo markdown wiki (LLM-authored notes + semantic search).
  # Payload: 1 MCP (`hallouminate serve`) + skills (wiki-ingest, wiki-init, etc).
  # native: true — native on Claude, Codex, and Copilot; decomposed on Cursor.
  # Native installation rescopes MCP tools to
  # mcp__plugin_hallouminate_hallouminate__*. Renderers rewrite the canonical
  # mcp__hallouminate__* permission glob and rennet's allowed tools. Cursor
  # keeps the canonical mcp__hallouminate__* names. The decomposed MCP replaces
  # the old standalone registry entry.
  hallouminate:
    git: https://github.com/paulnsorensen/hallouminate
    branch: main
    harnesses: [claude, codex, cursor, copilot]
    native: true
    description: Per-repo markdown wiki — semantic search + LLM-authored notes; bundles 6 wiki skills
