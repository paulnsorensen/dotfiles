# agents/plugins/registry.yaml — cross-harness plugin registry
#
# Each entry names a plugin and points at its marketplace root. At profile
# expansion time, cheese-flow discovers the payload primitives and feeds them
# into the existing per-harness renderers:
#
#   .mcp.json                         → MCP server(s), with the entry's harnesses list
#   skills/<n>/SKILL.md               → path: skill items
#   agents/*.md                       → agent items from leading YAML frontmatter
#   .claude-plugin/plugin.json hooks  → hook items (script hooks cross-harness)
#
# `commands/` is intentionally NOT decomposed. Native plugin installs may still
# expose commands inside their native harness; the decomposed path does not.
# `_source_dir` on every emitted item is stamped at the plugin payload root
# (NOT the repo root). Renderers resolve payload files via:
#   Path(item["_source_dir"]) / item["path"]
#
# Schema per entry:
#   KEY:           the entry name (e.g. `milknado`) MUST equal a plugins[].name
#                  in the marketplace.json — that named plugin is the one
#                  decomposed. A key/name mismatch fails loud at ingest.
#
#   Source (at least one is required; path wins when both are present):
#   path:          marketplace root (local checkout); ~-relative, /absolute, or
#                  repo-relative. Use on machines that have a local dev tree.
#   git:           clone URL (e.g. https://github.com/org/repo). Dotfiles
#                  prepares / refreshes the checkout at
#                  ~/.cache/cheese-flow/plugins/<KEY>.
#   branch:        branch to prepare (optional; default: main). Used with git:.
#
#   harnesses:     primitive membership list. MCP membership is explicit to
#                  avoid blanket-wide per-request token tax; non-MCP plugin
#                  primitives default to every harness that supports them.
#   native:        which harnesses get the NATIVE marketplace install (atomic
#                  plugin install + plugin-scoped mcp__plugin_<plugin>_<server>__
#                  tool names) instead of decomposed primitives. Accepts:
#                    true            → every supported native harness in
#                                      harnesses (claude, copilot)
#                    false / absent  → decomposed everywhere (default)
#                    [claude, ...]    → only the listed supported native
#                                      harnesses; must be ⊆ `harnesses`
#                  Non-native harnesses always get decomposed primitives. The
#                  renderers rewrite canonical mcp__<server>__* permission
#                  rules + skill allowed-tools to the plugin-namespaced form
#                  on harnesses where the plugin is native.
#   gate_unless:   optional env var gate on the decomposed MCP items (same
#                  semantics as the MCP registry). Does NOT gate a native
#                  install descriptor.
#   description:   human-readable description
#
# Per-harness reach:
#   claude   → native marketplace install when native ∋ claude; else MCP + skills + agents + hooks
#   codex    → MCP + skills + agents + hooks (never native in this contract)
#   opencode → MCP + skills + agents (never native — no drivable CLI install)
#   cursor   → MCP + skills + agents + hooks (never native — GUI marketplace only)
#   copilot  → native marketplace install when native ∋ copilot; else skills + hooks + agents (+ MCP if harnesses ∋ copilot)
#   crush    → MCP only (never native — no plugin concept)
#   commands → unsupported on the decomposed path for every harness
#
# Edit this file, then run `dots sync` to deploy; global Claude configuration
# remains chezmoi-authoritative (see chezmoi/.chezmoidata/claude.yaml).

plugins:
  # milknado: Mikado execution engine
  # Payload: 1 MCP + 3 skills (harvest, load-roadmap, milknado-config)
  # NOTE: uvx milknado-mcp requires milknado to be published to PyPI.
  # Until then, rendered configs will reference the portable form but
  # the MCP will not launch without a local uvx-resolvable install.
  milknado:
    git: https://github.com/paulnsorensen/milknado
    branch: main
    harnesses: [claude, codex, opencode, cursor, copilot, crush]
    native: [claude, copilot]
    # Codex stays on the decomposed path: native projection is supported only
    # for Claude and Copilot, and DEDUP must not hide Codex primitives.
    # Keep the native list explicit until every supported native renderer
    # accepts this marketplace.
    description: Mikado execution engine — goal decomposition, batch planning, detached ralph-loop runs

  # hallouminate: per-repo markdown wiki (LLM-authored notes + semantic search).
  # Payload: 1 MCP (`hallouminate serve`) + skills (wiki-ingest, wiki-init, etc).
  # native: true — native on claude+copilot, decomposed on codex/opencode/cursor/crush.
  # Going native rescopes the MCP tools to mcp__plugin_hallouminate_hallouminate__*
  # on the native harnesses; the renderers rewrite the canonical
  # mcp__hallouminate__* permission glob and rennet's allowed-tools accordingly
  # (renderer-side, no canonical-source edit). Decomposed harnesses keep the
  # bare mcp__hallouminate__* (claude/cursor grammar) / lowered <server>_<tool>
  # (opencode/crush). Migrated out of agents/mcp/registry.yaml — the
  # decomposition provides the MCP on non-native harnesses; a duplicate there
  # would fail loud.
  hallouminate:
    git: https://github.com/paulnsorensen/hallouminate
    branch: main
    harnesses: [claude, codex, opencode, cursor, copilot, crush]
    native: true
    description: Per-repo markdown wiki — semantic search + LLM-authored notes; bundles 6 wiki skills
