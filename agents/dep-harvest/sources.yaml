# dep-harvest — repos whose open Renovate/Dependabot PRs this routine triages.
#
# A weekly Claude cloud routine (agents/dep-harvest/routine.md) fans out one
# subagent per repo with at least one open bot PR (per bin/dep-harvest-scan's
# JSON). Each PR ends the run in exactly one terminal state: auto-merge-enabled
# (never a direct merge), repaired then auto-merge-enabled, held (labeled +
# commented for a human), or the repo is reported UNREACHABLE. Separately, the
# routine mines each bump's changelog for capabilities worth adopting and
# files at most one adoption issue per repo.
#
# GATE: auto-merge is enabled ONLY for a patch/minor bump with green CI and no
# conflict. Every major bump, every unparseable version, and every red or
# pending CI that repair did not turn green stays with a human — never
# auto-merged.
#
# Schema per entry:
#   name       repo name (also the GitHub repo slug component)
#   owner      GitHub org/user that owns the repo
#   clone      https clone URL
#   category   grouping used for the header comments below
#
# Deliberately EXCLUDED: paulnsorensen/n8n-mcp. It is a fork of an upstream
# project — its bot PRs track the upstream's own dependencies, not ours to
# merge or repair.

