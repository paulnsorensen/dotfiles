id: bash-shorten-test-numeric-ne
language: bash
severity: hint
message: '[ $V -ne N ] → (( V != N ))  (numeric inequality)'
rule:
  all:
    - pattern: '[ $VAR -ne $N ]'
    - has:
        kind: variable_name
        pattern: $V
        stopBy: end
constraints:
  VAR:
    regex: '^\$[A-Za-z_]\w*$'
  N:
    regex: '^(0|[1-9]\d*)$'
fix: '(( $V != $N ))'
