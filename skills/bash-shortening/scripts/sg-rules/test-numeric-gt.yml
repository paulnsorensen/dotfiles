id: bash-shorten-test-numeric-gt
language: bash
severity: hint
message: '[ $V -gt N ] → (( V > N ))  (greater-than)'
rule:
  all:
    - pattern: '[ $VAR -gt $N ]'
    - has:
        kind: variable_name
        pattern: $V
        stopBy: end
constraints:
  VAR:
    regex: '^\$[A-Za-z_]\w*$'
  N:
    regex: '^(0|[1-9]\d*)$'
fix: '(( $V > $N ))'
