id: bash-shorten-test-numeric-ge
language: bash
severity: hint
message: '[ $V -ge N ] → (( V >= N ))  (greater-or-equal)'
rule:
  all:
    - pattern: '[ $VAR -ge $N ]'
    - has:
        kind: variable_name
        pattern: $V
        stopBy: end
constraints:
  VAR:
    regex: '^\$[A-Za-z_]\w*$'
  N:
    regex: '^(0|[1-9]\d*)$'
fix: '(( $V >= $N ))'
