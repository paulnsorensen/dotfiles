id: bash-shorten-test-numeric-lt
language: bash
severity: hint
message: '[ $V -lt N ] → (( V < N ))  (less-than)'
rule:
  all:
    - pattern: '[ $VAR -lt $N ]'
    - has:
        kind: variable_name
        pattern: $V
        stopBy: end
constraints:
  VAR:
    regex: '^\$[A-Za-z_]\w*$'
  N:
    regex: '^(0|[1-9]\d*)$'
fix: '(( $V < $N ))'
