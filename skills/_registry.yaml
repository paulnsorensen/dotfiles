# Skill Install Registry — external skill source repos, consumed by two legs:
#   1. chezmoi assembly (_cz_vendor_external_skills in .sync-lib.sh): vendors
#      skills for claude + shared dir on every `dots sync`.
#   2. npx `skills add` (chezmoi/lib/install-external.sh): refreshes
#      Cursor only (SKILL_HARNESSES) on every `dots sync`.
#
# Each entry is a GitHub repo in OWNER/REPO format. The `skills` CLI discovers
# `skills/<name>/SKILL.md` and `.agents/skills/<name>/SKILL.md` when the registry
# passes `--skill '*'`.
#
# Optional fields:
#   skills:      explicit list of skill names (passed as repeated --skill; else '*')
#   pin:         git branch or tag (appended as <repo>@<ref> → `git clone --branch`;
#                commit SHAs are NOT supported by the clone-based fetch)
#   skills_path: in-repo dir to scan for skills (default "skills"); consumed by
#                chezmoi assembly and stale-skill reconciliation. It is not
#                passed to `npx skills add`. Sources limited to `harnesses:
#                [omp]` skip that path because the skill-agents map omits OMP.
#
# Installs always run with --copy (overwrite); the source repo is shallow-cloned
# once per entry and copied into every configured harness in one invocation.
#
# Harnesses are configured in .env via SKILL_HARNESSES (space-separated).
#
# Plugin skill sources (milknado, hallouminate below) ship the decomposed
# skills of a cross-harness plugin (agents/plugins/registry.yaml) into the
# shared dir via skills_path: plugins/<name>/skills. Their harnesses: is the
# shared-dir set {codex, copilot, zed, omp} minus the plugin's resolved
# native set (native: true -> harnesses ∩ {claude, codex, copilot}; a list ->
# that list; absent/false -> empty) — zed and omp are never native, so every
# plugin source ships to at least those two.
#
# Usage:
#   dots sync            Vendor + deploy for claude + shared dir; refresh Cursor skills
#   dots upgrade         Pull dotfiles, then run the same sync + skill refresh
#   skill-ls             List installed global skills (npx skills list --global)

sources:
  paulnsorensen/easy-cheese:
    description: Portable agent workflow toolkit — mold, cook, press, age, cure, melt, and related gates
  paulnsorensen/skillz-that-grillz:
    description: Other useful skills
    harnesses: [claude]
  paulnsorensen/routines:
    description: Cloud-routine skills — wiki-curator (applied by the routines at runtime), routine-scaffold, routine-env
    # PRIVATE repo. _cz_vendor_external_skills clones plain HTTPS, so this
    # source depends on a git credential helper (`gh auth setup-git`); without
    # one the clone fails and the sync reports the source unavailable rather
    # than silently dropping the skills.
    skills: [wiki-curator, routine-scaffold, routine-env]
  paulnsorensen/sliced-bread-architecture:
    description: Sliced Bread doctrine skills — seam/spine coherence review, five-rule change review, slice depth scoring
  paulnsorensen/milknado:
    description: Mikado-graph plugin skills (harvest, load-roadmap, milknado-config) for harnesses where the plugin is decomposed
    skills_path: plugins/milknado/skills
    harnesses: [codex, zed, omp]
  paulnsorensen/hallouminate:
    description: Wiki plugin skills (wiki-*) for harnesses with no plugin system
    skills_path: plugins/hallouminate/skills
    harnesses: [zed, omp]
